name: Deploy Public Site to GitHub Pages

# Deploys ONLY public-site/ — the homepage and the public Weekly
# Pulse share pages. This is a deliberately separate, minimal
# Expo project (its own package.json/app.json) so that the admin
# panel and login screens (which live in the main app at the
# repo root) can never end up in what's built and published here.
# See public-site/src/constants/theme.ts for why its components
# are plain copies instead of importing from the main app.

on:
  push:
    branches:
      - main
    paths:
      - 'public-site/**'
      - '.github/workflows/deploy-pages.yml'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: public-site/package-lock.json

      - name: Install dependencies
        working-directory: public-site
        run: npm ci

      - name: Export Expo web
        working-directory: public-site
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: npx expo export --platform web

      - name: Add GitHub Pages SPA fallback
        working-directory: public-site
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public-site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
